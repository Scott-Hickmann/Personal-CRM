[package]
name = "personal-crm"
version = "0.1.0"
edition = "2024"
description = "A local, macOS-only personal CRM"
license = "MIT"

[[bin]]
name = "crm"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
dirs = "6"
keyring = { version = "3.6", features = ["apple-native"] }
phonenumber = "0.3.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.39", features = ["bundled", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"
sha2 = "0.10"
url = "2.5"
uuid = { version = "1", features = ["serde", "v4"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.29", default-features = false, features = ["events"] }

[dev-dependencies]
tempfile = "3"
